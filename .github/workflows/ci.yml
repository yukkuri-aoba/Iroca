# push/PR ごとの最小 CI。
# 「コンパイルが通るか」を人間のローカル環境に頼らず機械検証する（2026-08 監査 §CI 不在への対応）。
#
# - metadata:    package.json / docs/index.json の JSON 妥当性と BOM 混入チェック
#                （BOM は release.yml の jq を壊す既知の事故経路）
# - build-check: GameCI の Unity イメージから UnityEngine/UnityEditor DLL を借りて
#                dotnet 型チェック（Unity エディタは起動しない）。
#                IrocaEditor.Debug.csproj は本体を ProjectReference するため 1 ビルドで
#                本体 + Debug 衛星の両方を検証できる。
#                headless ハーネス（Harness.csproj）のビルドも検証し、
#                Code/Core の取り込みリスト切れ（新規ファイル追加漏れ）を検知する。
#
# 回帰テスト(pytest)はテスト資産がプライベートリポジトリ(Iroca_dev_safe)のため未実施。
# 追加する場合は deploy key を Secrets に登録して checkout を足すこと。
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

# 同一ブランチ/PR への連続 push で古い実行を積み上げない（build-check は Unity イメージ
# を引くので 1 本が重い）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: metadata validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: JSON parse & required fields
        run: |
          jq -e '.name and .version and .url' package.json > /dev/null
          jq -e '.packages | type == "object"' docs/index.json > /dev/null
          echo "package.json version: $(jq -r .version package.json)"
      # BOM は release.yml の jq を壊す既知の事故経路。決め打ち 2 ファイルだと、新しい
      # JSON を足したときに素通りする。追跡中の JSON を全件見る。
      # 併せて、2026-06-28 レビューの displayName 文字化けと同型の事故（不正な UTF-8 が
      # そのまま公開される）を機械検出する。.ps1 は Windows PowerShell 5.1 が
      # BOM 無しを cp932 として読むため BOM が必要で、BOM 検査の対象外。
      - name: UTF-8 BOM / エンコーディング検査
        run: |
          fail=0
          for f in $(git ls-files '*.json'); do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "::error file=$f::UTF-8 BOM が混入しています（jq が parse に失敗します）"
              fail=1
            fi
          done
          for f in $(git ls-files '*.json' '*.md' '*.cs' '*.asmdef' '*.yml' '*.ps1'); do
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "::error file=$f::UTF-8 として不正なバイト列です（文字化けの原因）"
              fail=1
            fi
          done
          exit $fail

  build-check:
    name: build-check (dotnet type check)
    runs-on: ubuntu-latest
    container:
      # Unity 2022.3.22f1 の DLL 参照用。エディタは起動しないのでライセンス不要。
      image: unityci/editor:ubuntu-2022.3.22f1-base-3.2.2
    env:
      UNITY_EDITOR_PATH: /opt/unity/Editor/Data/Managed
      UnityManaged: /opt/unity/Editor/Data/Managed
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: 8.0.423  # 浮動の 8.0.x だと SDK 更新で型チェック結果が変わる
      - name: 本体 + Debug 衛星の型チェック
        run: dotnet build scripts/build-check/IrocaEditor.Debug.csproj -c Release -nologo
      - name: headless ハーネスのビルド検証
        run: dotnet build scripts/headless-run/Harness.csproj -c Release -nologo
