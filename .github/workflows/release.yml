name: Release VPM Package

# フロー: scripts/Build-VpmPackage.ps1 で zip + SHA256 + docs/index.json を更新
#   → main へコミット → v<VERSION> タグ push → 本ワークフローが整合検証 + draft 作成
#   → 人間が zip / unitypackage を draft へアップロードして publish
#   → release-verify.yml が公開資産の SHA256 を docs/index.json と照合
# 手順の全体像は docs/RELEASING.md を参照。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACKAGE_ID: com.yukkuri-aoba.iroca

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 起動条件のタグパターン 'v*' は緩く、v0.2 や vfoo でも走ってしまう。
          # 以降のステップは全て v<semver> 前提なので、ここで弾く。
          # （同時に、以後シェルへ渡す VERSION が semver 文字だけであることを保証する）
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::タグ $GITHUB_REF_NAME が v<semver> 形式ではありません"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # プレリリース判定は semver のプレリリース部の有無で決める。
          # contains(ref_name,'beta') の部分一致は rc/dev を取りこぼし、
          # 逆に 1.0.0-notbeta のような名前も拾う。
          case "$VERSION" in
            *-*) echo "PRERELEASE=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # tag / package.json / CHANGELOG / docs/index.json のバージョン整合を検証。
      # 不一致のまま draft を作らない（壊れた listing を公開する事故の防止）。
      - name: Validate version consistency
        env:
          # ${{ }} をシェルスクリプトへ直接展開しない（タグ名由来のインジェクション面を潰す）
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          EXPECTED_URL="https://github.com/$REPO/releases/download/v$VERSION/$PACKAGE_ID-$VERSION.zip"

          PKG_VERSION=$(jq -r .version package.json)
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json の version ($PKG_VERSION) が tag ($VERSION) と不一致"
            exit 1
          fi

          PKG_URL=$(jq -r '.url // empty' package.json)
          if [ "$PKG_URL" != "$EXPECTED_URL" ]; then
            echo "::error::package.json の url が想定リリース URL と不一致 (Build-VpmPackage.ps1 を実行し忘れていないか)"
            echo "  actual:   $PKG_URL"
            echo "  expected: $EXPECTED_URL"
            exit 1
          fi

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md に '## [$VERSION]' 節がありません"
            exit 1
          fi

          LISTING_URL=$(jq -r --arg id "$PACKAGE_ID" --arg v "$VERSION" \
            '.packages[$id].versions[$v].url // empty' docs/index.json)
          if [ "$LISTING_URL" != "$EXPECTED_URL" ]; then
            echo "::error::docs/index.json に $VERSION のエントリが無いか URL が不一致 (Build-VpmPackage.ps1 を実行し忘れていないか)"
            echo "  actual:   $LISTING_URL"
            echo "  expected: $EXPECTED_URL"
            exit 1
          fi

          LISTING_SHA=$(jq -r --arg id "$PACKAGE_ID" --arg v "$VERSION" \
            '.packages[$id].versions[$v].zipSHA256 // empty' docs/index.json)
          if [ -z "$LISTING_SHA" ]; then
            echo "::error::docs/index.json の $VERSION エントリに zipSHA256 がありません"
            exit 1
          fi
          echo "listing SHA256: $LISTING_SHA"

      # docs/RELEASING.md の「公開前の一度きり復旧タスク」（2026-07-02 起票の listing 破損）が
      # 未消化の間はリリースを進めさせない。チェックリストを完了して該当節を削除すると自動解除。
      - name: Block release while listing-recovery checklist remains
        run: |
          if grep -q "公開前の一度きり復旧タスク" docs/RELEASING.md; then
            echo "::error::docs/RELEASING.md の「公開前の一度きり復旧タスク」が未消化です。完了して該当節を削除してから再タグしてください。"
            exit 1
          fi

      - name: Build release body
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          BODY=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md の [$VERSION] 節が空です"
            exit 1
          fi
          SHA=$(jq -r --arg id "$PACKAGE_ID" --arg v "$VERSION" \
            '.packages[$id].versions[$v].zipSHA256' docs/index.json)
          # GITHUB_OUTPUT の heredoc 経由だと、CHANGELOG に区切り行と同じ文字列が 1 行あるだけで
          # 出力が壊れる（任意の step output を注入できる）。ファイルに書いて body_path で渡す。
          {
            printf '%s\n\n' "$BODY"
            echo "---"
            echo "### 公開前チェックリスト（draft のまま実施 → 完了後にこの節を削除して publish）"
            echo "- [ ] \`$PACKAGE_ID-$VERSION.zip\` をこのリリースへアップロード（SHA256 = \`$SHA\`）"
            echo "- [ ] \`Iroca_Ver$VERSION.unitypackage\` をこのリリースへアップロード"
            echo "- [ ] publish 後、release-verify ワークフローが成功することを確認"
          } > "$RUNNER_TEMP/release-body.md"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Iroca v${{ steps.version.outputs.VERSION }}"
          body_path: ${{ runner.temp }}/release-body.md
          draft: true
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
