<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>いろか BOOTH 表紙候補（3案）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@500;700;900&family=Yusei+Magic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="promo.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 爆発形バッジ(14スパイク) -->
    <polygon id="burst-shape" points="120.0,0.0 140.5,30.3 172.1,11.9 177.4,48.1 213.8,45.2 202.9,80.1 237.0,93.3 212.0,120.0 237.0,146.7 202.9,159.9 213.8,194.8 177.4,191.9 172.1,228.1 140.5,209.7 120.0,240.0 99.5,209.7 67.9,228.1 62.6,191.9 26.2,194.8 37.1,159.9 3.0,146.7 28.0,120.0 3.0,93.3 37.1,80.1 26.2,45.2 62.6,48.1 67.9,11.9 99.5,30.3"/>
    <!-- 太矢印 -->
    <g id="arrow-shape">
      <polygon points="4,32 74,32 74,8 126,46 74,84 74,60 4,60"
               stroke-linejoin="round" stroke-width="9"/>
    </g>
  </defs>
</svg>

<!-- ============ 案1 王道レッド ============ -->
<section class="cover c1" id="cover-1">
  <div class="title">
    <span class="fk l1" data-t="その色、">その色、</span><br>
    <span class="fk l2" data-t="変えられます。">変えられます。</span>
  </div>
  <div class="sub">PSDなしで直接色改変。陰影・模様はそのまま</div>

  <div class="photo before">
    <span class="tag">変更前</span>
    <img src="images/ba-before-wide.png" alt="">
  </div>
  <div class="arrow">
    <svg width="170" height="120" viewBox="0 0 130 92">
      <use href="#arrow-shape" fill="#fff" stroke="#8e1a10"/>
    </svg>
  </div>
  <div class="photo after">
    <span class="tag">変更後</span>
    <img src="images/ba-after-wide.png" alt="">
  </div>

  <div class="burst">
    <svg viewBox="0 0 240 240"><use href="#burst-shape"/></svg>
    <span class="lb">無料</span>
  </div>

  <div class="band">
    <div class="pitch">スポイトで選ぶだけ！</div>
    <div class="name">いろか<small>Iroca｜Unity用ツール</small></div>
  </div>
</section>

<!-- ============ 案2 さわやかブルー ============ -->
<section class="cover c2" id="cover-2">
  <div class="burst">
    <svg viewBox="0 0 240 240"><use href="#burst-shape"/></svg>
    <span class="lb">無料</span>
  </div>

  <div class="title">
    <span class="fk l1" data-t="PSDがなくても、">PSDがなくても、</span><br>
    <span class="fk l2" data-t="色を変えられる。">色を変えられる。</span>
  </div>
  <div class="sub">スポイトで選ぶだけ。陰影・模様はそのまま。</div>

  <div class="photo before">
    <span class="tag">変更前</span>
    <img src="images/ba-before.png" alt="">
  </div>
  <div class="arrow">
    <svg width="150" height="106" viewBox="0 0 130 92">
      <use href="#arrow-shape" fill="#fff" stroke="#14538f"/>
    </svg>
  </div>
  <div class="photo after">
    <span class="tag">変更後</span>
    <img src="images/ba-after.png" alt="">
  </div>

  <div class="band">
    <span class="name">いろか</span>
    <span class="pitch">Unity用テクスチャ色替えツール｜基本無料</span>
  </div>
</section>

<!-- ============ 案3 ダークビビッド ============ -->
<section class="cover c3" id="cover-3">
  <div class="title">
    <div class="l1">その<span class="em">色</span>、</div>
    <div class="l2">変えられます。</div>
  </div>
  <div class="sub">スポイトで選ぶだけ。PSD不要。</div>

  <div class="photo before">
    <span class="tag">変更前</span>
    <img src="images/ba-before.png" alt="">
  </div>
  <div class="arrow">
    <svg width="160" height="113" viewBox="0 0 130 92">
      <use href="#arrow-shape" fill="#ffd23e" stroke="#17171f"/>
    </svg>
  </div>
  <div class="photo after">
    <span class="tag">変更後</span>
    <img src="images/ba-after-wide.png" alt="">
  </div>

  <!-- 三角模様を囲む手描き風リング -->
  <svg class="ring" style="left:490px; top:680px; transform:rotate(-6deg)" width="420" height="220" viewBox="0 0 500 240">
    <path d="M 20 130 C 40 30, 200 8, 320 22 C 430 35, 500 90, 480 150 C 455 205, 300 225, 170 205 C 60 188, 10 150, 40 90"
          fill="none" stroke="#ffd23e" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <div class="note n2">白い模様はそのまま！</div>

  <div class="burst">
    <svg viewBox="0 0 240 240"><use href="#burst-shape"/></svg>
    <span class="lb">無料</span>
  </div>

  <div class="footer">
    <div class="name">いろか<small>Iroca</small></div>
    <div class="pitch">VRChatアバター向け・Unity Editor拡張・基本無料</div>
  </div>
</section>

</body>
</html>
