; リポジトリルートの pytest 設定。
;
; これが無いと rootdir が呼び出しディレクトリ次第で変わり、`pytest scripts/golden/` を
; 単独実行したときに dev_safe/Tests/conftest.py が読まれず「未登録マーカー」警告が出ていた
; （レビュー 2026-08-06 §6-20）。
;
; マーカー定義は dev_safe/Tests/conftest.py にも同じものがある。dev_safe は独立した
; プライベートリポジトリで単体 clone され得るため、両方に置いて（rootdir がどちらでも）
; 登録が効くようにしている。片方を変えたらもう片方も合わせること。

[pytest]
; 既定オプション（コマンドラインで後から指定した値が優先される）。
;
; -m "not perf": perf マーカーは「品質を検査せず処理時間だけ測る」テスト
;   （test_perf_extreme の 4K/8K/16K）。予算超過でも warning を出すだけで FAIL しないので
;   回帰検出には寄与しない一方、16K は入出力 raw だけで 2GB 超・数分かかる。
;   計測したいときは `-m perf` を付ける（後勝ちで既定を上書きする）。
; -n 4 --dist loadfile: ワーカー 4 並列。**loadfile は必須**で、ファイル単位に割り当てる。
;   既定の分配だと同じモジュールのテストが別ワーカーへ散り、module スコープの
;   fixture（被写体 1 セットの再着色をまとめて 1 回だけ回す）が各ワーカーで再実行されて
;   かえって遅くなる。直列で走らせたいときは `-p no:xdist` か `-n 0`。
addopts = -m "not perf" -n 4 --dist loadfile

testpaths =
    dev_safe/Tests
    scripts/golden

norecursedirs =
    .venv
    .git
    dev_safe/texture_sample
    dev_safe/Tests/Baselines
    dev_safe/Tests/visual_review
    *.egg-info
    __pycache__

markers =
    perf: パフォーマンス計測テスト(品質検査なし、-m perf で単独実行)
    slow: メモリ/時間コストが大きいテスト(デフォルト実行では省略推奨)
