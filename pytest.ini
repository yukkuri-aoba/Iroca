; リポジトリルートの pytest 設定。
;
; これが無いと rootdir が呼び出しディレクトリ次第で変わり、`pytest scripts/golden/` を
; 単独実行したときに dev_safe/Tests/conftest.py が読まれず「未登録マーカー」警告が出ていた
; （レビュー 2026-08-06 §6-20）。
;
; マーカー定義は dev_safe/Tests/conftest.py にも同じものがある。dev_safe は独立した
; プライベートリポジトリで単体 clone され得るため、両方に置いて（rootdir がどちらでも）
; 登録が効くようにしている。片方を変えたらもう片方も合わせること。

[pytest]
testpaths =
    dev_safe/Tests
    scripts/golden

norecursedirs =
    .venv
    .git
    dev_safe/texture_sample
    dev_safe/Tests/Baselines
    dev_safe/Tests/visual_review
    *.egg-info
    __pycache__

markers =
    perf: パフォーマンス計測テスト(品質検査なし、-m perf で単独実行)
    slow: メモリ/時間コストが大きいテスト(デフォルト実行では省略推奨)
